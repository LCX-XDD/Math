<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字记忆挑战</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 浏览器标签 Favicon 核心代码 -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/16/2906/2906299.png" type="image/png">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/16/2906/2906299.png" type="image/png">
    <!-- 适配高分辨率设备（可选） -->
    <link rel="icon" sizes="32x32" href="https://cdn-icons-png.flaticon.com/16/2906/2906299.png" type="image/png">
    <link rel="icon" sizes="16x16" href="https://cdn-icons-png.flaticon.com/16/2906/2906299.png" type="image/png">
    <!-- 移动端应用图标（可选，添加后手机保存书签时显示图标） -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn-icons-png.flaticon.com/16/2906/2906299.png">
    <meta name="apple-mobile-web-app-title" content="数字记忆挑战">
      <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js"></script>
  <script>
    // 初始化 LeanCloud（替换为你的应用凭证）
    AV.init({
      appId: "BEQfGnHF8BeBEFO88ViNPtKQ-gzGzoHsz",
      appKey: "3svRKA7Hb5dbNmmrN2OGViqq",
      serverURL: "https://BEQfGnHF8BeBEFO88ViNPtKQ-gzGzoHsz.lc-cn-n1-shared.com"
    });
  </script>
</head>
<body>

<!-- 全局加载动画 -->
<div id="global-loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">加载中，请稍候...</div>
</div>

    <!-- 新增：登录弹窗 -->
    <!-- 登录弹窗 -->
<!-- 登录弹窗 -->
<div id="login-modal" class="auth-modal">
  <div class="auth-content" style="position: relative;">
    <h2>🔐 登录</h2>
    <div class="auth-form">
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="login-account" placeholder="请输入账号">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="请输入密码">
      </div>
      <div class="auth-msg" id="login-msg"></div>
      <button class="auth-btn" id="do-login">登录</button>
      
      <!-- 👇 新增：管理员入口按钮 -->
<button 
  class="auth-btn admin-btn" 
  id="go-admin" 
  style="
    position: absolute;
    top: 10px;
    right: 10px;
    background: transparent;
    color: #aaa;
    border: none;
    font-size: 11px;
    padding: 4px 6px;
    cursor: pointer;
    opacity: 0.5;
  "
>
  管理
</button>
      <div class="auth-switch">
        还没有账号？<a href="javascript:;" id="go-register">立即注册</a>
      </div>
    </div>
  </div>
</div>

    <!-- 新增：注册弹窗 -->
    <!-- 注册弹窗 -->
<div id="register-modal" class="auth-modal" style="display: none;">
  <div class="auth-content">
    <h2>📱 注册</h2>
    <div class="auth-form">
      <!-- 给输入框添加 ID：register-name、register-account、register-password -->
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="register-name" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="register-account" placeholder="请输入账号">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="register-password" placeholder="请输入密码（≥6位）">
      </div>
        <div class="form-group">
          <label>找回密码邮箱</label>
          <input type="email" id="register-email" placeholder="请输入你的邮箱（用于找回密码）">
        </div>
      <div class="auth-msg" id="register-msg"></div>
      <button class="auth-btn" id="do-register">注册</button>
      <div class="auth-switch">
        已有账号？<a href="javascript:;" id="go-login">立即登录</a>
      </div>
    </div>
  </div>
</div>

    <!-- 游戏内容（默认隐藏，登录后显示） -->
    <div class="game-container" id="game-container" style="display: none;">
        <!-- 顶部分数栏（总累计分+当前分数） -->
        <div class="top-score-bar">
            <div class="total-accumulated-score">
                总累计分：<span id="total-accumulated-score">0</span>
            </div>
            <div class="current-score">
                当前分数：<span id="current-score">0</span>
            </div>
        </div>

        <h1>数字记忆挑战 🧠</h1>
        <p class="game-desc">选择难度后点击开始游戏，将显示对应位数的随机数字，记住并输入正确答案 ✨</p>
        
        <!-- 难度选择区域 -->
        <div class="difficulty-selection">
            <label>选择难度 <span class="emoji">🎯</span>：</label>
            <div class="select-wrapper">
                <select id="difficulty-select" class="difficulty-select">
                    <option value="easy">简单 📱</option>
                    <option value="medium">中等 📝</option>
                    <option value="hard">困难 📞</option>
                    <option value="hell">地狱 🆔</option>
                </select>
            </div>
            <span class="difficulty-hint" id="difficulty-hint-text">相当于短验证码</span>
        </div>
        
        <!-- 数字显示区域 -->
        <div class="number-display">?</div>
        <div class="countdown-hint" id="countdown-hint">准备开始记忆...</div>
        
        <!-- 游戏控制区 -->
        <div class="controls">
            <button id="start-btn" class="btn">开始游戏 🚀</button>
            <input type="number" id="answer-input" placeholder="输入4位数字" disabled>
            <button id="submit-btn" class="btn" disabled>提交答案 ✅</button>
            <button id="ranking-btn" class="btn">排行榜 🏆</button>
            <button id="profile-btn" class="btn">个人中心 👤</button>
            <!-- 新增：退出登录按钮 -->
            <button id="logout-btn" class="btn">退出登录 🚪</button>
        </div>

        <!-- 底部统计栏（总游戏次数+正确率） -->
        <div class="bottom-stats-bar">
            <div class="total-games">
                总游戏次数：<span id="total-games">0</span>
            </div>
            <div class="accuracy">
                总正确率：<span id="accuracy">0%</span>
            </div>
        </div>
    </div>
    <script src="js/game.js"></script>
   <!-- ====================== 管理员面板 ====================== -->
<div id="admin-panel" class="admin-panel" style="display:none;">
  <div class="admin-header">
    <h2>🔐 管理员后台 - 全部用户数据</h2>
    <button id="exit-admin" class="btn">退出管理员面板</button>
  </div>
  <div class="admin-table-container">
    <table class="admin-table">
      <thead>
        <tr>
          <th>排名</th>
          <th>用户名</th>
          <th>登录账号</th>
         <th>绑定邮箱</th> 
          <th>总分</th>
          <th>游戏次数</th>
          <th>正确率</th>
          <th>用户ID</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="admin-user-list">
        <tr><td colspan="9">加载中...</td></tr>
      </tbody>
    </table>
  </div>
</div>
<!-- ====================== 个人中心面板 ====================== -->
<div id="profile-modal" class="auth-modal" style="display:none;">
  <div class="auth-content" style="max-width:600px; text-align:left; max-height:90vh; overflow-y:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>👤 个人中心</h2>
      <button id="close-profile" class="btn" style="padding:6px 12px;">关闭</button>
    </div>

    <div style="margin:14px 0;">
      <p><strong>账号：</strong> <span id="profile-account"></span></p>
      <p style="display:flex; align-items:center; gap:8px;">
        <strong>昵称：</strong> <span id="profile-nickname"></span>
        <button id="edit-nickname-btn" style="border:none; background:none; cursor:pointer; font-size:16px;">✏️</button>
      </p>
      <p><strong>总分：</strong> <span id="profile-total-score"></span></p>
      <p><strong>游戏次数：</strong> <span id="profile-total-games"></span></p>
      <p><strong>正确率：</strong> <span id="profile-accuracy"></span></p>
    </div>

    <hr style="margin:20px 0;">
    <h3 style="margin-bottom:10px;">📜 最近游戏记录</h3>
    <div id="profile-records" style="max-height:300px; overflow-y:auto;">
      加载中...
    </div>
  </div>
</div>
</body>
</html>
